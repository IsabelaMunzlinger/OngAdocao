spring:
  config:
    import: optional:file:.env[.properties]
  main:
    banner-mode: off
  application:
    name: ong_adocao
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/ong_adocao?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: ${MYSQL_USER:root}
    password: ${MYSQL_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
  mvc:
    hiddenmethod:
      filter:
        enabled: true
  ssl:
    bundle:
      jks:
        web:                       # certificado TLS desta aplicação
          keystore:
            location: ${APP_KEYSTORE:file:./certs/app.p12}
            password: ${APP_KEYSTORE_PASSWORD}
            type: PKCS12
        oidc:                      # em quem esta aplicação confia ao chamar o provedor
          truststore:
            location: ${OIDC_TRUSTSTORE:file:./certs/truststore.p12}
            password: ${OIDC_TRUSTSTORE_PASSWORD}
            type: PKCS12

server:
  port: 8443
  ssl:
    bundle: web
  servlet:
    session:
      timeout: 30m                 # expiração por inatividade
      cookie:
        name: ONG_SESSION_ID
        http-only: true
        secure: true
        same-site: lax
        path: /

oidc:
  issuer: ${OIDC_ISSUER:https://localhost:9000}
  authorization-endpoint: ${OIDC_AUTH_ENDPOINT:https://localhost:9000/authorize}
  token-endpoint: ${OIDC_TOKEN_ENDPOINT:https://localhost:9000/token}
  userinfo-endpoint: ${OIDC_USERINFO_ENDPOINT:https://localhost:9000/userinfo}
  jwks-uri: ${OIDC_JWKS_URI:https://localhost:9000/jwks.json}   # só usado como conferência; o valor efetivo vem da descoberta
  end-session-endpoint: ${OIDC_LOGOUT_ENDPOINT:https://localhost:9000/logout}
  post-logout-redirect-uri: ${OIDC_POST_LOGOUT_REDIRECT_URI:https://localhost:8443/login?logout=true}
  client-id: ${OIDC_CLIENT_ID}
  client-secret: ${OIDC_CLIENT_SECRET}
  redirect-uri: ${OIDC_REDIRECT_URI:https://localhost:8443/callback}
  auto-provision: ${OIDC_AUTO_PROVISION:false}
  absolute-session-hours: 8        # expiração absoluta da sessão local
