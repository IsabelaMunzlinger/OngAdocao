<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de Contato | ONG Adoção</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/padrao.css}">
    <link rel="icon" type="image/png" th:href="@{/Icones/cachorro.png}">
    <style>
        body { background-color: #f1f5f9; color: #1e293b; }
        .form-card { max-width: 760px; border: 1px solid #e2e8f0; border-radius: 1rem; box-shadow: 0 10px 25px -5px rgba(15, 23, 42, 0.06); }
        .icon-badge { width: 48px; height: 48px; border-radius: 0.75rem; background: #eff6ff; color: #2563eb; display: inline-flex; align-items: center; justify-content: center; font-size: 1.4rem; }
        .form-label { font-weight: 600; font-size: 0.875rem; color: #334155; }
        .form-control, .form-select { border-radius: 0.6rem; border-color: #cbd5e1; padding: 0.625rem 0.875rem; }
        .form-control:focus, .form-select:focus { border-color: #10b981; box-shadow: 0 0 0 0.2rem rgba(16, 185, 129, 0.18); }
        .btn-emerald { background-color: #059669; border-color: #059669; color: #fff; font-weight: 600; border-radius: 0.6rem; padding: 0.55rem 1.4rem; }
        .btn-emerald:hover { background-color: #047857; border-color: #047857; color: #fff; }
        .btn-cancel { border-radius: 0.6rem; padding: 0.55rem 1.25rem; font-weight: 500; }
    </style>
</head>
<body class="d-flex flex-column min-vh-100">

<nav th:replace="~{fragments/navbar :: navbar}"></nav>

<main class="container my-5 flex-grow-1">
    <div class="card form-card mx-auto bg-white">
        <div class="card-body p-4 p-md-5">

            <div class="d-flex flex-wrap align-items-center justify-content-between gap-3 pb-4 mb-4 border-bottom">
                <div class="d-flex align-items-center gap-3">
                    <div class="icon-badge"><i class="bi bi-telephone-plus-fill"></i></div>
                    <div>
                        <h4 class="mb-0 fw-bold text-dark">Cadastro de Contato</h4>
                        <p class="text-muted small mb-0">Vincule e-mail e celular a um usuário cadastrado</p>
                    </div>
                </div>
                <span th:if="${usuarioLogado != null}"
                      class="badge rounded-pill px-3 py-2"
                      th:classappend="${isAdmin} ? 'bg-success-subtle text-success border border-success-subtle' : 'bg-primary-subtle text-primary border border-primary-subtle'">
                    <i class="bi" th:classappend="${isAdmin} ? 'bi-shield-check me-1' : 'bi-person-badge me-1'"></i>
                    <span th:text="${perfilUsuario}">Operador</span>
                </span>
            </div>

            <div th:if="${sucesso}" class="alert alert-success d-flex align-items-center gap-2 rounded-3" role="alert">
                <i class="bi bi-check-circle-fill"></i>
                <span th:text="${sucesso}"></span>
            </div>
            <div th:if="${erro}" class="alert alert-danger d-flex align-items-center gap-2 rounded-3" role="alert">
                <i class="bi bi-exclamation-triangle-fill"></i>
                <span th:text="${erro}"></span>
            </div>

            <form th:action="@{/contato/salvar}" th:object="${contatoDTO}" method="post">
                <input type="hidden" name="id" th:value="*{id}" />

                <div class="row g-3 mb-3">
                    <div class="col-md-6">
                        <label class="form-label" for="email">E-mail <span class="text-danger">*</span></label>
                        <input type="email" class="form-control" th:field="*{email}" id="email" placeholder="exemplo@email.com" required>
                        <div class="text-danger small mt-1" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></div>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label" for="celular">Celular (somente números) <span class="text-danger">*</span></label>
                        <input type="text" class="form-control" th:field="*{celular}" id="celular"
                               placeholder="49912345678"
                               required maxlength="11" pattern="[0-9]{11}"
                               title="Digite exatamente 11 números, com DDD.">
                        <div class="text-danger small mt-1" th:if="${#fields.hasErrors('celular')}" th:errors="*{celular}"></div>
                    </div>
                </div>

                <div class="mb-4">
                    <label class="form-label" for="usuarioId">Usuário Associado <span class="text-danger">*</span></label>
                    <select class="form-select" th:field="*{usuarioId}" id="usuarioId" required>
                        <option value="">Selecione o usuário...</option>
                        <option th:each="usuario : ${usuarios}"
                                th:value="${usuario.id}"
                                th:text="${usuario.nome} + ' (CPF: ' + ${usuario.cpf} + ')'"></option>
                    </select>
                    <div class="text-danger small mt-1" th:if="${#fields.hasErrors('usuarioId')}" th:errors="*{usuarioId}"></div>
                </div>

                <div class="d-flex justify-content-end gap-2 pt-3 border-top">
                    <a th:href="@{/}" class="btn btn-light border btn-cancel">
                        <i class="bi bi-x-lg me-1"></i> Cancelar
                    </a>
                    <button type="submit" class="btn btn-emerald">
                        <i class="bi bi-check2-circle me-1"></i> Salvar Contato
                    </button>
                </div>
            </form>

        </div>
    </div>
</main>

<footer th:replace="~{fragments/footer :: footer}"></footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
    setTimeout(() => document.querySelectorAll('.alert').forEach(alert => alert.remove()), 3500);
</script>
</body>
</html>
