<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de Endereço | ONG Adoção</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/padrao.css}">
    <link rel="icon" type="image/png" th:href="@{/Icones/cachorro.png}">
    <style>
        body { background-color: #f1f5f9; color: #1e293b; }
        .form-card { max-width: 860px; border: 1px solid #e2e8f0; border-radius: 1rem; box-shadow: 0 10px 25px -5px rgba(15, 23, 42, 0.06); }
        .icon-badge { width: 48px; height: 48px; border-radius: 0.75rem; background: #ecfdf5; color: #059669; display: inline-flex; align-items: center; justify-content: center; font-size: 1.4rem; }
        .section-title { font-size: 0.78rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em; color: #64748b; margin-bottom: 1rem; }
        .form-label { font-weight: 600; font-size: 0.875rem; color: #334155; }
        .form-control, .form-select { border-radius: 0.6rem; border-color: #cbd5e1; padding: 0.625rem 0.875rem; }
        .form-control:focus, .form-select:focus { border-color: #10b981; box-shadow: 0 0 0 0.2rem rgba(16, 185, 129, 0.18); }
        .btn-emerald { background-color: #059669; border-color: #059669; color: #fff; font-weight: 600; border-radius: 0.6rem; padding: 0.55rem 1.4rem; }
        .btn-emerald:hover { background-color: #047857; border-color: #047857; color: #fff; }
        .btn-cancel { border-radius: 0.6rem; padding: 0.55rem 1.25rem; font-weight: 500; }
    </style>
</head>
<body class="d-flex flex-column min-vh-100">

<nav th:replace="~{fragments/navbar :: navbar}"></nav>

<main class="container my-5 flex-grow-1">
    <div class="card form-card mx-auto bg-white">
        <div class="card-body p-4 p-md-5">

            <div class="d-flex flex-wrap align-items-center justify-content-between gap-3 pb-4 mb-4 border-bottom">
                <div class="d-flex align-items-center gap-3">
                    <div class="icon-badge"><i class="bi bi-geo-alt-fill"></i></div>
                    <div>
                        <h4 class="mb-0 fw-bold text-dark">Cadastro de Endereço</h4>
                        <p class="text-muted small mb-0">Informe o CEP para preenchimento automático da localização</p>
                    </div>
                </div>
                <span th:if="${usuarioLogado != null}"
                      class="badge rounded-pill px-3 py-2"
                      th:classappend="${isAdmin} ? 'bg-success-subtle text-success border border-success-subtle' : 'bg-primary-subtle text-primary border border-primary-subtle'">
                    <i class="bi" th:classappend="${isAdmin} ? 'bi-shield-check me-1' : 'bi-person-badge me-1'"></i>
                    <span th:text="${perfilUsuario}">Operador</span>
                </span>
            </div>

            <div th:if="${sucesso}" class="alert alert-success d-flex align-items-center gap-2 rounded-3" role="alert">
                <i class="bi bi-check-circle-fill"></i>
                <span th:text="${sucesso}"></span>
            </div>
            <div th:if="${erro}" class="alert alert-danger d-flex align-items-center gap-2 rounded-3" role="alert">
                <i class="bi bi-exclamation-triangle-fill"></i>
                <span th:text="${erro}"></span>
            </div>

            <form th:action="@{/endereco/salvar}" th:object="${enderecoDTO}" method="post">
                <input type="hidden" name="id" th:value="*{id}" />

                <div class="section-title"><i class="bi bi-signpost-split me-1"></i> Logradouro</div>
                <div class="row g-3 mb-4">
                    <div class="col-md-4">
                        <label class="form-label" for="cep">CEP <span class="text-danger">*</span></label>
                        <div class="input-group">
                            <input type="text" class="form-control" th:field="*{cep}" id="cep"
                                   placeholder="89600000" required maxlength="8" pattern="[0-9]{8}"
                                   title="Digite exatamente 8 números.">
                            <div class="input-group-text bg-white" id="cep-spinner-container" style="display: none;">
                                <div class="spinner-border spinner-border-sm text-success" role="status">
                                    <span class="visually-hidden">Carregando...</span>
                                </div>
                            </div>
                        </div>
                        <div class="text-danger small mt-1" th:if="${#fields.hasErrors('cep')}" th:errors="*{cep}"></div>
                    </div>
                    <div class="col-md-8">
                        <label class="form-label" for="rua">Rua <span class="text-danger">*</span></label>
                        <input type="text" class="form-control" th:field="*{rua}" id="rua" placeholder="Preenchido automaticamente pelo CEP" required>
                        <div class="text-danger small mt-1" th:if="${#fields.hasErrors('rua')}" th:errors="*{rua}"></div>
                    </div>
                    <div class="col-md-8">
                        <label class="form-label" for="bairro">Bairro <span class="text-danger">*</span></label>
                        <input type="text" class="form-control" th:field="*{bairro}" id="bairro" placeholder="Preenchido automaticamente pelo CEP" required>
                        <div class="text-danger small mt-1" th:if="${#fields.hasErrors('bairro')}" th:errors="*{bairro}"></div>
                    </div>
                    <div class="col-md-4">
                        <label class="form-label" for="numero">Número <span class="text-danger">*</span></label>
                        <input type="text" class="form-control" th:field="*{numero}" id="numero" placeholder="Ex: 123 ou S/N" required>
                        <div class="text-danger small mt-1" th:if="${#fields.hasErrors('numero')}" th:errors="*{numero}"></div>
                    </div>
                </div>

                <div class="section-title"><i class="bi bi-building me-1"></i> Cidade e Vínculo</div>
                <div class="row g-3 mb-4">
                    <div class="col-md-5">
                        <label class="form-label" for="cidade">Cidade <span class="text-danger">*</span></label>
                        <input type="text" class="form-control" th:field="*{cidade}" id="cidade" placeholder="Preenchido pelo CEP" required>
                        <div class="text-danger small mt-1" th:if="${#fields.hasErrors('cidade')}" th:errors="*{cidade}"></div>
                    </div>
                    <div class="col-md-3">
                        <label class="form-label" for="estado">UF <span class="text-danger">*</span></label>
                        <input type="text" class="form-control text-uppercase" th:field="*{estado}" id="estado" placeholder="SC"
                               required maxlength="2" minlength="2">
                        <div class="text-danger small mt-1" th:if="${#fields.hasErrors('estado')}" th:errors="*{estado}"></div>
                    </div>
                    <div class="col-md-4">
                        <label class="form-label" for="pais">País <span class="text-danger">*</span></label>
                        <input type="text" class="form-control" th:field="*{pais}" id="pais" value="Brasil" required>
                        <div class="text-danger small mt-1" th:if="${#fields.hasErrors('pais')}" th:errors="*{pais}"></div>
                    </div>
                    <div class="col-md-5">
                        <label class="form-label" for="tipo">Tipo de Endereço <span class="text-danger">*</span></label>
                        <select class="form-select" th:field="*{tipo}" id="tipo" required>
                            <option value="">Selecione...</option>
                            <option th:each="tipoEnum : ${tiposDeEndereco}"
                                    th:value="${tipoEnum}"
                                    th:text="${tipoEnum.name()}"></option>
                        </select>
                        <div class="text-danger small mt-1" th:if="${#fields.hasErrors('tipo')}" th:errors="*{tipo}"></div>
                    </div>
                    <div class="col-md-7">
                        <label class="form-label" for="usuarioId">Usuário Associado <span class="text-danger">*</span></label>
                        <select class="form-select" th:field="*{usuarioId}" id="usuarioId" required>
                            <option value="">Selecione o usuário...</option>
                            <option th:each="usuario : ${usuarios}"
                                    th:value="${usuario.id}"
                                    th:text="${usuario.nome} + ' (CPF: ' + ${usuario.cpf} + ')'"></option>
                        </select>
                        <div class="text-danger small mt-1" th:if="${#fields.hasErrors('usuarioId')}" th:errors="*{usuarioId}"></div>
                    </div>
                </div>

                <div class="d-flex justify-content-end gap-2 pt-3 border-top">
                    <a th:href="@{/}" class="btn btn-light border btn-cancel">
                        <i class="bi bi-x-lg me-1"></i> Cancelar
                    </a>
                    <button type="submit" class="btn btn-emerald">
                        <i class="bi bi-check2-circle me-1"></i> Salvar Endereço
                    </button>
                </div>
            </form>

        </div>
    </div>
</main>

<footer th:replace="~{fragments/footer :: footer}"></footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
    setTimeout(() => document.querySelectorAll('.alert').forEach(alert => alert.remove()), 3500);

    const cepInput = document.getElementById('cep');
    const ruaInput = document.getElementById('rua');
    const bairroInput = document.getElementById('bairro');
    const cidadeInput = document.getElementById('cidade');
    const estadoInput = document.getElementById('estado');
    const numeroInput = document.getElementById('numero');
    const cepSpinner = document.getElementById('cep-spinner-container');

    function toggleAddressFields(disabled) {
        ruaInput.readOnly = disabled;
        bairroInput.readOnly = disabled;
        cidadeInput.readOnly = disabled;
        estadoInput.readOnly = disabled;
    }

    cepInput.addEventListener('blur', function() {
        const cepValue = this.value.replace(/\D/g, '');

        if (cepValue.length === 8) {
            cepSpinner.style.display = 'flex';
            toggleAddressFields(true);

            fetch(`/api/cep/consultar/${cepValue}`)
                .then(response => {
                    if (!response.ok) { throw new Error('CEP não encontrado'); }
                    return response.json();
                })
                .then(data => {
                    if (data.erro) {
                        throw new Error('CEP não existe na base de dados.');
                    }

                    cidadeInput.value = data.localidade;
                    estadoInput.value = data.uf;

                    if (data.logradouro) {
                        ruaInput.value = data.logradouro;
                        bairroInput.value = data.bairro;
                        toggleAddressFields(true);
                        numeroInput.focus();
                    } else {
                        ruaInput.value = '';
                        bairroInput.value = '';
                        toggleAddressFields(false);
                        ruaInput.focus();
                    }
                })
                .catch(error => {
                    console.error('Erro ao buscar CEP:', error);
                    toggleAddressFields(false);
                })
                .finally(() => {
                    cepSpinner.style.display = 'none';
                });
        }
    });
</script>
</body>
</html>
