<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head-default}"></head>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de Animal | ONG Adoção</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/padrao.css}">
    <link rel="icon" type="image/png" th:href="@{/Icones/cahorro.png}">
    <style>
        body { background-color: #f1f5f9; color: #1e293b; }
        .form-card { max-width: 920px; border: 1px solid #e2e8f0; border-radius: 1rem; box-shadow: 0 10px 25px -5px rgba(15, 23, 42, 0.06); }
        .icon-badge { width: 48px; height: 48px; border-radius: 0.75rem; background: #ecfdf5; color: #059669; display: inline-flex; align-items: center; justify-content: center; font-size: 1.4rem; }
        .section-title { font-size: 0.78rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em; color: #64748b; margin-bottom: 1rem; }
        .form-label { font-weight: 600; font-size: 0.875rem; color: #334155; }
        .form-control, .form-select { border-radius: 0.6rem; border-color: #cbd5e1; padding: 0.625rem 0.875rem; }
        .form-control:focus, .form-select:focus { border-color: #10b981; box-shadow: 0 0 0 0.2rem rgba(16, 185, 129, 0.18); }
        .btn-emerald { background-color: #059669; border-color: #059669; color: #fff; font-weight: 600; border-radius: 0.6rem; padding: 0.55rem 1.4rem; }
        .btn-emerald:hover { background-color: #047857; border-color: #047857; color: #fff; }
        .btn-cancel { border-radius: 0.6rem; padding: 0.55rem 1.25rem; font-weight: 500; }
    </style>
</head>
<body class="d-flex flex-column min-vh-100">

<nav th:replace="~{fragments/navbar :: navbar}"></nav>

<main class="container my-5 flex-grow-1">
    <div class="card form-card mx-auto bg-white">
        <div class="card-body p-4 p-md-5">

            <div class="d-flex flex-wrap align-items-center justify-content-between gap-3 pb-4 mb-4 border-bottom">
                <div class="d-flex align-items-center gap-3">
                    <div class="icon-badge"><i class="bi bi-heart-fill"></i></div>
                    <div>
                        <h4 class="mb-0 fw-bold text-dark">Cadastro de Animal</h4>
                        <p class="text-muted small mb-0">Registre as características físicas, datas e história do pet</p>
                    </div>
                </div>
                <span th:if="${usuarioLogado != null}"
                      class="badge rounded-pill px-3 py-2"
                      th:classappend="${isAdmin} ? 'bg-success-subtle text-success border border-success-subtle' : 'bg-primary-subtle text-primary border border-primary-subtle'">
                    <i class="bi" th:classappend="${isAdmin} ? 'bi-shield-check me-1' : 'bi-person-badge me-1'"></i>
                    <span th:text="${perfilUsuario}">Operador</span>
                </span>
            </div>

            <div th:if="${Sucesso}" class="alert alert-success d-flex align-items-center gap-2 rounded-3" role="alert">
                <i class="bi bi-check-circle-fill"></i>
                <span th:text="${Sucesso}"></span>
            </div>
            <div th:if="${Erro}" class="alert alert-danger d-flex align-items-center gap-2 rounded-3" role="alert">
                <i class="bi bi-exclamation-triangle-fill"></i>
                <span th:text="${Erro}"></span>
            </div>

            <form th:action="@{/animal/salvarAnimal}" th:object="${animalDTO}" method="post">
                <input type="hidden" name="id" th:value="*{id()}">

                <div class="section-title"><i class="bi bi-tag me-1"></i> Identificação e Características</div>
                <div class="row g-3 mb-4">
                    <div class="col-md-6">
                        <label class="form-label" for="nome">Nome <span class="text-danger">*</span></label>
                        <input type="text" class="form-control" id="nome" name="nome" th:value="*{nome()}" placeholder="Ex: Thor, Luna..." required>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label" for="tipo">Espécie / Tipo <span class="text-danger">*</span></label>
                        <select class="form-select" id="tipo" name="tipo" required>
                            <option value="">Selecione o tipo...</option>
                            <option th:each="tipoEnum : ${tiposDeAnimal}"
                                    th:value="${tipoEnum}"
                                    th:text="${tipoEnum.displayName}"
                                    th:selected="${tipoEnum == animalDTO.tipo()}">
                            </option>
                        </select>
                    </div>
                    <div class="col-md-4">
                        <label class="form-label" for="raca">Raça <span class="text-danger">*</span></label>
                        <input type="text" class="form-control" id="raca" name="raca" th:value="*{raca()}" placeholder="Ex: SRD, Poodle..." required>
                    </div>
                    <div class="col-md-4">
                        <label class="form-label" for="cor">Cor <span class="text-danger">*</span></label>
                        <input type="text" class="form-control" id="cor" name="cor" th:value="*{cor()}" placeholder="Ex: Caramelo, Preto..." required>
                    </div>
                    <div class="col-md-4">
                        <label class="form-label" for="sexo">Sexo <span class="text-danger">*</span></label>
                        <select class="form-select" id="sexo" th:field="*{sexo}" required>
                            <option value="">Selecione...</option>
                            <option value="M">Macho</option>
                            <option value="F">Fêmea</option>
                        </select>
                    </div>
                    <div class="col-md-4">
                        <label class="form-label" for="porte">Porte <span class="text-danger">*</span></label>
                        <select class="form-select" id="porte" name="porte" required>
                            <option value="">Selecione...</option>
                            <option th:each="porteEnum : ${portesDeAnimal}"
                                    th:value="${porteEnum}"
                                    th:text="${porteEnum.displayName}"
                                    th:selected="${porteEnum == animalDTO.porte()}">
                            </option>
                        </select>
                    </div>
                    <div class="col-md-4">
                        <label class="form-label" for="peso">Peso (kg) <span class="text-danger">*</span></label>
                        <input type="number" step="0.01" class="form-control" id="peso" name="peso" th:value="*{peso()}" placeholder="Ex: 12.50" required>
                    </div>
                    <div class="col-md-4">
                        <label class="form-label" for="idade">Idade Estimada (anos)</label>
                        <input type="number" class="form-control" id="idade" name="idade" th:value="*{idade()}" placeholder="Ex: 2">
                    </div>
                </div>

                <div class="section-title"><i class="bi bi-calendar3 me-1"></i> Datas de Controle</div>
                <div class="row g-3 mb-4">
                    <div class="col-md-6">
                        <label class="form-label" for="dataNascimento">Data de Nascimento (opcional)</label>
                        <input type="datetime-local" class="form-control" id="dataNascimento" name="dataNascimento"
                               th:value="*{dataNascimento() != null ? #temporals.format(dataNascimento(), 'yyyy-MM-dd''T''HH:mm') : ''}">
                    </div>
                    <div class="col-md-6">
                        <label class="form-label" for="dataChegada">Data de Chegada na ONG <span class="text-danger">*</span></label>
                        <input type="datetime-local" class="form-control" id="dataChegada" name="dataChegada"
                               th:value="*{dataChegada() != null ? #temporals.format(dataChegada(), 'yyyy-MM-dd''T''HH:mm') : ''}" required>
                    </div>
                </div>

                <div class="section-title"><i class="bi bi-card-text me-1"></i> Perfil e Mídia</div>
                <div class="row g-3 mb-4">
                    <div class="col-12">
                        <label class="form-label" for="descricao">Descrição / Temperamento <span class="text-danger">*</span></label>
                        <textarea class="form-control" id="descricao" name="descricao" rows="2" th:text="*{descricao()}" placeholder="Dócil, brincalhão, convive bem com outros animais..." required></textarea>
                    </div>
                    <div class="col-12">
                        <label class="form-label" for="historia">História de Resgate (opcional)</label>
                        <textarea class="form-control" id="historia" name="historia" rows="3" th:text="*{historia()}" placeholder="Conte onde e como o animal foi resgatado..."></textarea>
                    </div>
                    <div class="col-12">
                        <label class="form-label" for="foto">URL da Foto</label>
                        <input type="url" class="form-control" id="foto" name="foto" th:value="*{foto()}" placeholder="https://exemplo.com/foto-pet.jpg">
                    </div>
                </div>

                <div class="d-flex justify-content-end gap-2 pt-3 border-top">
                    <a th:href="@{/animal/listaAnimal}" class="btn btn-light border btn-cancel">
                        <i class="bi bi-x-lg me-1"></i> Cancelar
                    </a>
                    <button type="submit" class="btn btn-emerald">
                        <i class="bi bi-check2-circle me-1"></i> Salvar Animal
                    </button>
                </div>
            </form>

        </div>
    </div>
</main>

<footer th:replace="~{fragments/footer :: footer}"></footer>

<script>
    setTimeout(() => document.querySelectorAll('.alert').forEach(alert => alert.remove()), 3500);
</script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
