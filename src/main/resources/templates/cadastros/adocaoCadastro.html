<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head-default}"></head>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Registrar Adoção | ONG Adoção</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link rel="stylesheet" th:href="@{/css/padrao.css}">
  <link rel="icon" type="image/png" th:href="@{/Icones/cahorro.png}">
  <style>
    body { background-color: #f1f5f9; color: #1e293b; }
    .form-card { max-width: 860px; border: 1px solid #e2e8f0; border-radius: 1rem; box-shadow: 0 10px 25px -5px rgba(15, 23, 42, 0.06); }
    .icon-badge { width: 48px; height: 48px; border-radius: 0.75rem; background: #ecfdf5; color: #059669; display: inline-flex; align-items: center; justify-content: center; font-size: 1.4rem; }
    .section-title { font-size: 0.78rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em; color: #64748b; margin-bottom: 1rem; }
    .form-label { font-weight: 600; font-size: 0.875rem; color: #334155; }
    .form-control, .form-select { border-radius: 0.6rem; border-color: #cbd5e1; padding: 0.625rem 0.875rem; }
    .form-control:focus, .form-select:focus { border-color: #10b981; box-shadow: 0 0 0 0.2rem rgba(16, 185, 129, 0.18); }
    .btn-emerald { background-color: #059669; border-color: #059669; color: #fff; font-weight: 600; border-radius: 0.6rem; padding: 0.55rem 1.4rem; }
    .btn-emerald:hover { background-color: #047857; border-color: #047857; color: #fff; }
    .btn-cancel { border-radius: 0.6rem; padding: 0.55rem 1.25rem; font-weight: 500; }
  </style>
</head>
<body class="d-flex flex-column min-vh-100">

<nav th:replace="~{fragments/navbar :: navbar}"></nav>

<main class="container my-5 flex-grow-1">
  <div class="card form-card mx-auto bg-white">
    <div class="card-body p-4 p-md-5">

      <div class="d-flex flex-wrap align-items-center justify-content-between gap-3 pb-4 mb-4 border-bottom">
        <div class="d-flex align-items-center gap-3">
          <div class="icon-badge"><i class="bi bi-house-heart-fill"></i></div>
          <div>
            <h4 class="mb-0 fw-bold text-dark">Solicitação de Adoção</h4>
            <p class="text-muted small mb-0">Vincule um animal disponível ao adotante responsável</p>
          </div>
        </div>
        <span th:if="${usuarioLogado != null}"
              class="badge rounded-pill px-3 py-2"
              th:classappend="${isAdmin} ? 'bg-success-subtle text-success border border-success-subtle' : 'bg-primary-subtle text-primary border border-primary-subtle'">
                    <i class="bi" th:classappend="${isAdmin} ? 'bi-shield-check me-1' : 'bi-person-badge me-1'"></i>
                    <span th:text="${perfilUsuario}">Operador</span>
                </span>
      </div>

      <div th:if="${sucesso}" class="alert alert-success d-flex align-items-center gap-2 rounded-3" role="alert">
        <i class="bi bi-check-circle-fill"></i>
        <span th:text="${sucesso}"></span>
      </div>
      <div th:if="${erro}" class="alert alert-danger d-flex align-items-center gap-2 rounded-3" role="alert">
        <i class="bi bi-exclamation-triangle-fill"></i>
        <span th:text="${erro}"></span>
      </div>

      <form th:action="@{/adocao/salvar}" th:object="${adocaoDTO}" method="post">
        <div class="section-title"><i class="bi bi-people me-1"></i> Partes Envolvidas</div>
        <div class="row g-3 mb-4">
          <div class="col-md-6">
            <label class="form-label" for="animalNome">Animal a ser Adotado <span class="text-danger">*</span></label>
            <input type="hidden" id="animalId" th:field="*{animalId}" required>
            <div class="input-group">
              <input type="text" id="animalNome" class="form-control bg-light"
                     th:value="${animalSelecionado != null ? animalSelecionado.nome : ''}"
                     placeholder="Selecione um animal..." readonly>
              <button class="btn btn-outline-success" type="button" data-bs-toggle="modal" data-bs-target="#modalAnimais">
                <i class="bi bi-search me-1"></i> Selecionar
              </button>
            </div>
            <div class="text-danger small mt-1" th:if="${#fields.hasErrors('animalId')}" th:errors="*{animalId}"></div>
          </div>

          <div class="col-md-6">
            <label class="form-label" for="usuarioNome">Adotante <span class="text-danger">*</span></label>
            <input type="hidden" id="usuarioId" th:field="*{usuarioId}" required>
            <div class="input-group">
              <input type="text" id="usuarioNome" class="form-control bg-light"
                     th:value="${adotanteFixo != null ? adotanteFixo.nome : ''}"
                     placeholder="Selecione um adotante..." readonly>
              <button th:if="${!isAdotante}" class="btn btn-outline-success" type="button"
                      data-bs-toggle="modal" data-bs-target="#modalUsuarios">
                <i class="bi bi-search me-1"></i> Selecionar
              </button>
            </div>
            <div class="text-danger small mt-1" th:if="${#fields.hasErrors('usuarioId')}" th:errors="*{usuarioId}"></div>
          </div>
        </div>

        <div class="section-title"><i class="bi bi-journal-text me-1"></i> Detalhes da Solicitação</div>
        <div class="row g-3 mb-4">
          <div class="col-md-6">
            <label for="dataAdocao" class="form-label">Data e Hora da Solicitação <span class="text-danger">*</span></label>
            <input type="datetime-local" id="dataAdocao" class="form-control" th:field="*{dataAdocao}" required>
            <div class="text-danger small mt-1" th:if="${#fields.hasErrors('dataAdocao')}" th:errors="*{dataAdocao}"></div>
          </div>
          <div class="col-12">
            <label for="observacoes" class="form-label">Observações</label>
            <textarea id="observacoes" class="form-control" rows="4" th:field="*{observacoes}" placeholder="Informações sobre entrevista, ambiente residencial, termo de responsabilidade..."></textarea>
          </div>
        </div>

        <div class="d-flex justify-content-end gap-2 pt-3 border-top">
          <a th:href="${isAdotante} ? @{/adocao} : @{/menuPrincipal}" class="btn btn-light border btn-cancel">
            <i class="bi bi-x-lg me-1"></i> Cancelar
          </a>
          <button type="submit" class="btn btn-emerald">
            <i class="bi bi-send-check me-1"></i> Enviar Solicitação
          </button>
        </div>
      </form>

    </div>
  </div>
</main>

<!-- Modal Animais Disponíveis -->
<div class="modal fade" id="modalAnimais" tabindex="-1">
  <div class="modal-dialog modal-lg modal-dialog-centered">
    <div class="modal-content border-0 shadow rounded-4">
      <div class="modal-header border-bottom">
        <h5 class="modal-title fw-bold"><i class="bi bi-heart me-2 text-success"></i>Selecionar Animal Disponível</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body p-4">
        <input type="text" id="pesquisaAnimalInput" class="form-control mb-3" placeholder="Pesquisar por nome...">
        <div class="table-responsive">
          <table class="table table-hover align-middle">
            <thead class="table-light">
            <tr>
              <th>Nome</th>
              <th>Tipo</th>
              <th>Raça</th>
              <th class="text-end">Ação</th>
            </tr>
            </thead>
            <tbody id="tabelaAnimaisBody">
            <tr th:each="animal : ${animaisDisponiveis}">
              <td class="fw-semibold" th:text="${animal.nome}"></td>
              <td th:text="${animal.tipo.displayName}"></td>
              <td th:text="${animal.raca}"></td>
              <td class="text-end">
                <button type="button" class="btn btn-success btn-sm rounded-3 btn-selecionar-animal"
                        th:data-id="${animal.id}"
                        th:data-nome="${animal.nome}">
                  <i class="bi bi-check2 me-1"></i> Selecionar
                </button>
              </td>
            </tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- Modal Adotantes -->
<div class="modal fade" id="modalUsuarios" tabindex="-1">
  <div class="modal-dialog modal-lg modal-dialog-centered">
    <div class="modal-content border-0 shadow rounded-4">
      <div class="modal-header border-bottom">
        <h5 class="modal-title fw-bold"><i class="bi bi-person-check me-2 text-success"></i>Selecionar Adotante</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body p-4">
        <input type="text" id="pesquisaUsuarioInput" class="form-control mb-3" placeholder="Pesquisar por nome ou CPF...">
        <div class="table-responsive">
          <table class="table table-hover align-middle">
            <thead class="table-light">
            <tr>
              <th>Nome</th>
              <th>CPF</th>
              <th class="text-end">Ação</th>
            </tr>
            </thead>
            <tbody id="tabelaUsuariosBody">
            <tr th:each="user : ${todosUsuarios}">
              <td class="fw-semibold" th:text="${user.nome}"></td>
              <td th:text="${user.cpf}"></td>
              <td class="text-end">
                <button type="button" class="btn btn-success btn-sm rounded-3 btn-selecionar-usuario"
                        th:data-id="${user.id}"
                        th:data-nome="${user.nome}">
                  <i class="bi bi-check2 me-1"></i> Selecionar
                </button>
              </td>
            </tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </div>
</div>

<footer th:replace="~{fragments/footer :: footer}"></footer>

<script>
  setTimeout(() => document.querySelectorAll('.alert').forEach(alert => alert.remove()), 3500);
</script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/JS/cadastro-adocao-script.js}"></script>
</body>
</html>
