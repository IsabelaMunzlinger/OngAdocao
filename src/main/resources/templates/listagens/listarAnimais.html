<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Listagem de Animais | ONG Adoção</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" th:href="@{/css/padrao.css}">
  <link rel="icon" type="image/png" th:href="@{/Icones/cachorro.png}">
  <style>
    body { background-color: #f1f5f9; color: #1e293b; }
    .list-card { border: 1px solid #e2e8f0; border-radius: 1rem; box-shadow: 0 10px 25px -5px rgba(15, 23, 42, 0.06); }
    .icon-badge { width: 48px; height: 48px; border-radius: 0.75rem; background: #ecfdf5; color: #059669; display: inline-flex; align-items: center; justify-content: center; font-size: 1.4rem; }
    .animal-photo { width: 56px; height: 56px; object-fit: cover; border-radius: 0.75rem; border: 1px solid #e2e8f0; }
    .table thead th { background-color: #f8fafc; color: #475569; font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.05em; font-weight: 700; border-bottom: 1px solid #e2e8f0; padding: 0.9rem 1rem; }
    .table tbody td { padding: 0.85rem 1rem; border-bottom-color: #f1f5f9; }
    .btn-emerald { background-color: #059669; border-color: #059669; color: #fff; font-weight: 600; border-radius: 0.6rem; }
    .btn-emerald:hover { background-color: #047857; border-color: #047857; color: #fff; }
  </style>
</head>
<body class="d-flex flex-column min-vh-100">

<nav th:replace="~{fragments/navbar :: navbar}"></nav>

<main class="container my-5 flex-grow-1">
  <div class="card list-card bg-white">
    <div class="card-body p-4 p-md-5">

      <div class="d-flex flex-wrap align-items-center justify-content-between gap-3 pb-4 mb-4 border-bottom">
        <div class="d-flex align-items-center gap-3">
          <div class="icon-badge"><i class="bi bi-heart-fill"></i></div>
          <div>
            <h4 class="mb-0 fw-bold text-dark">Animais Cadastrados</h4>
            <p class="text-muted small mb-0">Gerencie os pets da ONG, seus prontuários e disponibilidade</p>
          </div>
        </div>
        <div class="d-flex align-items-center gap-2">
                    <span th:if="${usuarioLogado != null}"
                          class="badge rounded-pill px-3 py-2"
                          th:classappend="${isAdmin} ? 'bg-success-subtle text-success border border-success-subtle' : 'bg-primary-subtle text-primary border border-primary-subtle'">
                        <i class="bi" th:classappend="${isAdmin} ? 'bi-shield-check me-1' : 'bi-person-badge me-1'"></i>
                        <span th:text="${perfilUsuario}">Operador</span>
                    </span>
          <a th:href="@{/animal/cadastroAnimal}" class="btn btn-emerald btn-sm px-3 py-2">
            <i class="bi bi-plus-lg me-1"></i> Cadastrar Novo Animal
          </a>
        </div>
      </div>

      <div th:if="${Sucesso}" class="alert alert-success d-flex align-items-center gap-2 rounded-3" role="alert">
        <i class="bi bi-check-circle-fill"></i>
        <span th:text="${Sucesso}"></span>
      </div>
      <div th:if="${Erro}" class="alert alert-danger d-flex align-items-center gap-2 rounded-3" role="alert">
        <i class="bi bi-exclamation-triangle-fill"></i>
        <span th:text="${Erro}"></span>
      </div>

      <div class="table-responsive rounded-3 border">
        <table class="table table-hover align-middle mb-0">
          <thead>
          <tr>
            <th scope="col">Foto</th>
            <th scope="col">Nome</th>
            <th scope="col">Espécie</th>
            <th scope="col">Raça</th>
            <th scope="col">Situação</th>
            <th scope="col" class="text-end">Ações</th>
          </tr>
          </thead>
          <tbody>
          <tr th:each="animal : ${listaAnimais}">
            <td>
              <img th:if="${animal.foto != null and !animal.foto.isEmpty()}"
                   th:src="${animal.foto}" alt="Foto do animal" class="animal-photo">
              <div th:unless="${animal.foto != null and !animal.foto.isEmpty()}"
                   class="animal-photo bg-light d-flex align-items-center justify-content-center text-muted">
                <i class="bi bi-image fs-5"></i>
              </div>
            </td>
            <td class="fw-semibold text-dark" th:text="${animal.nome}"></td>
            <td th:text="${animal.tipo.displayName}"></td>
            <td class="text-muted" th:text="${animal.raca}"></td>
            <td>
                            <span th:switch="${animal.situacao}">
                                <span th:case="'D'" class="badge rounded-pill px-3 py-1 bg-success-subtle text-success border border-success-subtle">Disponível</span>
                                <span th:case="'A'" class="badge rounded-pill px-3 py-1 bg-primary-subtle text-primary border border-primary-subtle">Adotado</span>
                                <span th:case="'T'" class="badge rounded-pill px-3 py-1 bg-warning-subtle text-warning-emphasis border border-warning-subtle">Em Análise</span>
                                <span th:case="*" class="badge rounded-pill px-3 py-1 bg-secondary-subtle text-secondary">Outro</span>
                            </span>
            </td>
            <td class="text-end">
              <div class="d-inline-flex gap-1">
                <a th:href="@{/prontuario/editar(animalId=${animal.id})}"
                   class="btn btn-outline-info btn-sm rounded-3" title="Editar Prontuário">
                  <i class="bi bi-file-earmark-medical-fill"></i>
                </a>
                <a th:href="@{/animal/editarAnimal(id=${animal.id})}"
                   class="btn btn-outline-warning btn-sm rounded-3" title="Editar Animal">
                  <i class="bi bi-pencil-fill"></i>
                </a>
                <!-- Excluir visível APENAS para ADMIN -->
                <a th:if="${isAdmin}"
                   th:href="@{/animal/excluir(id=${animal.id})}"
                   class="btn btn-outline-danger btn-sm rounded-3" title="Excluir Animal"
                   onclick="return confirm('Tem certeza que deseja excluir este animal?');">
                  <i class="bi bi-trash-fill"></i>
                </a>
              </div>
            </td>
          </tr>
          <tr th:if="${#lists.isEmpty(listaAnimais)}">
            <td colspan="6" class="text-center py-5 text-muted">
              <i class="bi bi-inbox fs-3 d-block mb-2"></i>
              Nenhum animal cadastrado no momento.
            </td>
          </tr>
          </tbody>
        </table>
      </div>

    </div>
  </div>
</main>

<footer th:replace="~{fragments/footer :: footer}"></footer>

<script>
  setTimeout(() => document.querySelectorAll('.alert').forEach(alert => alert.remove()), 3500);
</script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
