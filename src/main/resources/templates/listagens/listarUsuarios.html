<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head-default}"></head>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Listagem de Usuários | ONG Adoção</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" th:href="@{/css/padrao.css}">
    <style>
        body { background-color: #f1f5f9; color: #1e293b; }
        .list-card { border: 1px solid #e2e8f0; border-radius: 1rem; box-shadow: 0 10px 25px -5px rgba(15, 23, 42, 0.06); }
        .icon-badge { width: 48px; height: 48px; border-radius: 0.75rem; background: #eff6ff; color: #2563eb; display: inline-flex; align-items: center; justify-content: center; font-size: 1.4rem; }
        .avatar-circle { width: 38px; height: 38px; border-radius: 50%; background: #e2e8f0; color: #334155; font-weight: 700; display: inline-flex; align-items: center; justify-content: center; font-size: 0.9rem; }
        .table thead th { background-color: #f8fafc; color: #475569; font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.05em; font-weight: 700; border-bottom: 1px solid #e2e8f0; padding: 0.9rem 1rem; }
        .table tbody td { padding: 0.9rem 1rem; border-bottom-color: #f1f5f9; }
        .btn-emerald { background-color: #059669; border-color: #059669; color: #fff; font-weight: 600; border-radius: 0.6rem; }
        .btn-emerald:hover { background-color: #047857; border-color: #047857; color: #fff; }
    </style>
</head>
<body class="d-flex flex-column min-vh-100">

<nav th:replace="~{fragments/navbar :: navbar}"></nav>

<main class="container my-5 flex-grow-1">
    <div class="card list-card bg-white">
        <div class="card-body p-4 p-md-5">

            <div class="d-flex flex-wrap align-items-center justify-content-between gap-3 pb-4 mb-4 border-bottom">
                <div class="d-flex align-items-center gap-3">
                    <div class="icon-badge"><i class="bi bi-people-fill"></i></div>
                    <div>
                        <h4 class="mb-0 fw-bold text-dark">Usuários Cadastrados</h4>
                        <p class="text-muted small mb-0">Adotantes, voluntários e operadores registrados no sistema</p>
                    </div>
                </div>
                <div class="d-flex align-items-center gap-2">
                    <span th:if="${usuarioLogado != null}"
                          class="badge rounded-pill px-3 py-2"
                          th:classappend="${isAdmin} ? 'bg-success-subtle text-success border border-success-subtle' : 'bg-primary-subtle text-primary border border-primary-subtle'">
                        <i class="bi" th:classappend="${isAdmin} ? 'bi-shield-check me-1' : 'bi-person-badge me-1'"></i>
                        <span th:text="${perfilUsuario}">Operador</span>
                    </span>
                    <a th:if="${isAdmin}" th:href="@{/usuario/cadastroUsuario}" class="btn btn-emerald btn-sm px-3 py-2">
                        <i class="bi bi-person-plus-fill me-1"></i> Cadastrar Novo Usuário
                    </a>
                </div>
            </div>

            <div th:if="${sucesso}" class="alert alert-success d-flex align-items-center gap-2 rounded-3" role="alert">
                <i class="bi bi-check-circle-fill"></i>
                <span th:text="${sucesso}"></span>
            </div>
            <div th:if="${erro}" class="alert alert-danger d-flex align-items-center gap-2 rounded-3" role="alert">
                <i class="bi bi-exclamation-triangle-fill"></i>
                <span th:text="${erro}"></span>
            </div>

            <div class="table-responsive rounded-3 border">
                <table class="table table-hover align-middle mb-0">
                    <thead>
                    <tr>
                        <th scope="col">Nome</th>
                        <th scope="col">Usuário</th>
                        <th scope="col">CPF</th>
                        <th scope="col">Perfil</th>
                        <th scope="col" class="text-end" th:if="${isAdmin}">Ações</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="usuario : ${listaUsuarios}">
                        <td>
                            <div class="d-flex align-items-center gap-3">
                                <div class="avatar-circle"
                                     th:text="${usuario.nome != null and !usuario.nome.isEmpty() ? #strings.toUpperCase(#strings.substring(usuario.nome, 0, 1)) : 'U'}">
                                    U
                                </div>
                                <span class="fw-semibold text-dark" th:text="${usuario.nome}"></span>
                            </div>
                        </td>

                        <td class="text-muted" th:text="${usuario.userName != null ? usuario.userName : '—'}"></td>

                        <td class="text-muted font-monospace"
                            th:text="${usuario.cpf != null and #strings.length(usuario.cpf) == 11 ?
                                      #strings.substring(usuario.cpf, 0, 3) + '.' +
                                      #strings.substring(usuario.cpf, 3, 6) + '.' +
                                      #strings.substring(usuario.cpf, 6, 9) + '-' +
                                      #strings.substring(usuario.cpf, 9, 11) :
                                      (usuario.cpf != null ? usuario.cpf : 'Não informado')}">
                        </td>

                        <td>
                            <span class="badge rounded-pill px-3 py-1"
                                  th:classappend="${usuario.role == 'admin'} ? 'bg-success-subtle text-success border border-success-subtle' : (${usuario.role == 'user'} ? 'bg-primary-subtle text-primary border border-primary-subtle' : 'bg-info-subtle text-info-emphasis border border-info-subtle')"
                                  th:text="${usuario.role == 'admin'} ? 'Administrador' : (${usuario.role == 'user'} ? 'Operador' : 'Adotante')">
                            </span>
                        </td>

                        <td class="text-end" th:if="${isAdmin}">
                            <div class="d-inline-flex gap-1">
                                <a th:href="@{/usuario/editar(id=${usuario.id})}"
                                   class="btn btn-outline-warning btn-sm rounded-3" title="Editar Usuário">
                                    <i class="bi bi-pencil-fill"></i>
                                </a>

                                <a th:href="@{/usuario/excluir(id=${usuario.id})}"
                                   class="btn btn-outline-danger btn-sm rounded-3" title="Excluir Usuário"
                                   onclick="return confirm('Tem certeza que deseja excluir este usuário?');">
                                    <i class="bi bi-trash-fill"></i>
                                </a>
                            </div>
                        </td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(listaUsuarios)}">
                        <td th:colspan="${isAdmin ? 5 : 4}" class="text-center py-5 text-muted">
                            <i class="bi bi-inbox fs-3 d-block mb-2"></i>
                            Nenhum usuário cadastrado no momento.
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>

        </div>
    </div>
</main>

<footer th:replace="~{fragments/footer :: footer}"></footer>

<script>
    setTimeout(() => document.querySelectorAll('.alert').forEach(alert => alert.remove()), 3500);
</script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
