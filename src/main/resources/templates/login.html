<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Entrar | ONG Adocão</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="icon" type="image/png" th:href="@{/Icones/cachorro.png}">
    <style>
        body {
            background: linear-gradient(135deg, #f1f5f9 0%, #e2e8f0 100%);
            min-height: 100vh;
            color: #1e293b;
        }
        .login-card {
            max-width: 440px;
            width: 100%;
            border: 1px solid #e2e8f0;
            border-radius: 1.25rem;
            box-shadow: 0 20px 35px -10px rgba(15, 23, 42, 0.1);
        }
        .brand-icon {
            width: 56px;
            height: 56px;
            border-radius: 1rem;
            background: linear-gradient(135deg, #059669, #10b981);
            color: #ffffff;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 1.6rem;
            box-shadow: 0 8px 18px rgba(5, 150, 105, 0.25);
        }
        .form-control {
            border-radius: 0.65rem;
            border-color: #cbd5e1;
            padding: 0.65rem 0.9rem;
        }
        .form-control:focus {
            border-color: #10b981;
            box-shadow: 0 0 0 0.2rem rgba(16, 185, 129, 0.18);
        }
        .btn-emerald {
            background-color: #059669;
            border-color: #059669;
            color: #ffffff;
            font-weight: 600;
            border-radius: 0.65rem;
            padding: 0.65rem 1rem;
        }
        .btn-emerald:hover {
            background-color: #047857;
            border-color: #047857;
            color: #ffffff;
        }
        .divider {
            display: flex;
            align-items: center;
            text-align: center;
            color: #94a3b8;
            font-size: 0.8rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }
        .divider::before, .divider::after {
            content: '';
            flex: 1;
            border-bottom: 1px solid #e2e8f0;
        }
        .divider:not(:empty)::before { margin-right: .75em; }
        .divider:not(:empty)::after { margin-left: .75em; }
    </style>
</head>
<body class="d-flex align-items-center justify-content-center p-3">

<div class="card login-card bg-white p-4 p-md-5">
    <div class="text-center mb-4">
        <div class="brand-icon mx-auto mb-3">
            <i class="bi bi-heart-pulse-fill"></i>
        </div>
        <h4 class="fw-bold mb-1">ONG <span class="text-success">Adocão</span></h4>
        <p class="text-muted small mb-0">Acesse sua conta para continuar</p>
    </div>

    <div th:if="${param.error}" class="alert alert-danger d-flex align-items-center gap-2 rounded-3 small py-2">
        <i class="bi bi-exclamation-triangle-fill"></i>
        <span>Não foi possível autenticar.</span>
    </div>
    <div th:if="${param.logout}" class="alert alert-success d-flex align-items-center gap-2 rounded-3 small py-2">
        <i class="bi bi-check-circle-fill"></i>
        <span>Sessão encerrada com segurança.</span>
    </div>
    <div th:if="${param.expired}" class="alert alert-warning d-flex align-items-center gap-2 rounded-3 small py-2">
        <i class="bi bi-clock-history"></i>
        <span>Sua sessão expirou. Faça login novamente.</span>
    </div>

    <!-- Login OIDC -->
    <a th:href="@{/oauth2/login}" class="btn btn-outline-dark w-100 rounded-3 py-2 fw-medium">
        <i class="bi bi-shield-lock-fill me-2 text-primary"></i> Entrar
    </a>

    <div class="text-center mt-4 pt-3 border-top">
        <a th:href="@{/}" class="text-muted small text-decoration-none">
            <i class="bi bi-arrow-left me-1"></i> Voltar para o início
        </a>
    </div>
</div>

</body>
</html>
