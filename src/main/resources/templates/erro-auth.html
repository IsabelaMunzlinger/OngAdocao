<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head-default}"></head>
<body class="bg-light d-flex align-items-center justify-content-center" style="min-height: 100vh;">

<div class="card shadow p-4 text-center border-danger" style="max-width: 480px; width: 100%;">
    <h4 class="text-danger mb-3"><i class="bi bi-exclamation-triangle-fill me-2"></i>Falha na Autenticação</h4>
    <p th:text="${mensagemErro != null ? mensagemErro : 'Não foi possível concluir o login.'}"></p>
    <a th:href="@{/login}" class="btn btn-outline-primary mt-3">Voltar para o Login</a>
</div>

</body>
</html>
