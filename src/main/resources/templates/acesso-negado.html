<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acesso Negado | ONG Adocão</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
</head>
<body class="bg-light d-flex align-items-center justify-content-center p-3" style="min-height: 100vh;">

<div class="card border-0 shadow-sm rounded-4 p-4 p-md-5 text-center" style="max-width: 460px; width: 100%;">
    <div class="text-danger fs-1 mb-3">
        <i class="bi bi-shield-lock-fill"></i>
    </div>
    <h4 class="fw-bold text-dark mb-2">Acesso Não Autorizado</h4>
    <p class="text-muted small mb-4">
        Seu perfil atual (<strong th:text="${perfilUsuario}">Usuário</strong>) não possui permissão para acessar esta funcionalidade.
    </p>
    <a th:href="${isAdotante} ? @{/adocao} : @{/menuPrincipal}" class="btn btn-success rounded-3 px-4">
        <i class="bi bi-arrow-left me-1"></i> Voltar para área permitida
    </a>
</div>

</body>
</html>
